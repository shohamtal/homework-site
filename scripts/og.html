<!doctype html>
<!-- Source of assets/og.jpg (1200×630). Open in Chrome at that size and screenshot. og-bust.png is a circular crop of brand/miri-02-bust.jpg (repo miri-hw-seo). -->
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@500;700&display=swap">
<style>
  html,body{margin:0}
  body{width:1200px; height:630px; background:#FAFAFC radial-gradient(#E4E4EC 2px,transparent 2.5px) 0 0/30px 30px; font-family:Rubik,sans-serif; color:#17171F; display:flex; align-items:center; justify-content:center}
  .card{width:1060px; height:490px; box-sizing:border-box; background:#fff; border:5px solid #17171F; border-radius:36px; box-shadow:-14px 14px 0 #17171F; display:flex; align-items:center; gap:56px; padding:0 70px}
  .txt{flex:1; display:flex; flex-direction:column; gap:14px}
  h1{font-family:"Secular One"; font-weight:400; font-size:150px; line-height:1; margin:0}
  .bar{width:300px; height:30px; background:#FFE14D; border:4px solid #17171F; border-radius:8px}
  .slogan{font-family:"Secular One"; font-size:58px; color:#FF3D7F; line-height:1.1}
  .sub{font-size:31px; font-weight:500; color:#5F6070}
  .bust{width:340px; height:340px; flex:none}
</style></head><body>
<div class="card">
  <div class="txt">
    <h1>מירי</h1><div class="bar"></div>
    <div class="slogan">המורה שלך להצלחה</div>
    <div class="sub">הסברים, מעבדות ותרגול עם רמזים</div>
  </div>
  <img class="bust" src="og-bust.png" alt="">
</div>
</body></html>
